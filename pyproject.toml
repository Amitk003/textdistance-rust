[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "textdistance-rust"
version = "0.1.0"
description = "Native Rust port of the textdistance string distance library, API compatible with the original."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "TextDistance Rust contributors" }]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Rust",
    "Topic :: Text Processing",
    "License :: OSI Approved :: MIT License",
]

[tool.maturin]
python-source = "python"
module-name = "textdistance._textdistance"
manifest-path = "crates/pyapi/Cargo.toml"
features = ["extension-module"]
