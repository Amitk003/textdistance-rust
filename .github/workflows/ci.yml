name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the port and test dependencies
        run: python -m pip install . pytest hypothesis

      - name: Tests under tests/original are the pinned upstream files, byte-for-byte
        run: python scripts/verify_tests_pinned.py

      - name: Original test suite runs unmodified
        run: python -m pytest -m "not external" tests/original tests/port -q

      - name: Rust checks
        run: |
          cargo fmt --check
          cargo clippy --workspace -- -D warnings
          cargo test --workspace

      - name: Differential fuzz smoke (against the pinned reference)
        run: |
          bash scripts/fetch_reference.sh
          python fuzz/harness.py --duration 25 --no-logs

      - name: tdc CLI smoke
        run: cargo run -p tdc -- distance levenshtein test text
